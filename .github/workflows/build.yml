name: Build Geode Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build Android64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          cli: latest
          target: Android64

      - name: Upload Geode mod
        uses: actions/upload-artifact@v4
        with:
          name: Geode-RPC-test-Android64
          path: ${{ steps.build.outputs.build-output }}
